services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY}
      API_TOKEN_SIGNING_KEY: ${API_TOKEN_SIGNING_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      DATA_ROOT: /data
      SCHEMA_ROOT: /app/schemas
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      APP_VERSION: ${APP_VERSION:-unknown}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-4000}
      AI_MAX_HISTORY_MESSAGES: ${AI_MAX_HISTORY_MESSAGES:-20}
      AI_MAX_HISTORY_CHARS: ${AI_MAX_HISTORY_CHARS:-16000}
      AI_MAX_HISTORY_TURNS: ${AI_MAX_HISTORY_TURNS:-10}
      AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-6}
      AI_MAX_TOOL_ROUNDS: ${AI_MAX_TOOL_ROUNDS:-3}
      AI_MAX_TOTAL_TOKENS: ${AI_MAX_TOTAL_TOKENS:-100000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2000}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-20}
      AI_OVERALL_DEADLINE_SECONDS: ${AI_OVERALL_DEADLINE_SECONDS:-50}
      AI_DRAFT_TTL_HOURS: ${AI_DRAFT_TTL_HOURS:-168}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PROXY_FIX_X_FOR: ${PROXY_FIX_X_FOR:-0}
      PROXY_FIX_X_PROTO: ${PROXY_FIX_X_PROTO:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEP_ALIVE: ${GUNICORN_KEEP_ALIVE:-5}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
    volumes:
      - ./data:/data
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  mariadb_data:
