name: HealthTracker
options:
  bundleIdPrefix: io.healthtracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Team ID here (or in Xcode > Signing) to run on a physical iPhone.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  HealthTrackerKit:
    path: HealthTrackerKit
targets:
  HealthTracker:
    type: application
    platform: iOS
    sources:
      - path: HealthTracker
    dependencies:
      - package: HealthTrackerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.healthtracker.companion
        PRODUCT_NAME: Health Tracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Health Tracker
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Health Tracker se conecta a tu servidor privado en la red local cuando lo configuras con HTTP local en desarrollo."
        INFOPLIST_FILE: HealthTracker/Resources/Info.plist
  HealthTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HealthTrackerUITests
    dependencies:
      - target: HealthTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.healthtracker.companion.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HealthTracker
schemes:
  HealthTracker:
    build:
      targets:
        HealthTracker: all
        HealthTrackerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealthTrackerUITests
    archive:
      config: Release
