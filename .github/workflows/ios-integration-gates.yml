name: iOS integration gates

on:
  push:
    branches: [codex/nutrition-ios-integration-gates]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    if: ${{ !contains(github.event.head_commit.message, '[planning-regression]') }}
    name: Native PR ${{ matrix.pr }} against Nutrition
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 17
            head: e45722570eb7d81549aea2cd27cc007e3a13329b
    env:
      FLASK_SKIP_DOTENV: '1'
      NUTRITION_HEAD: 518deebc769550c9f4259fa9db3f49107df113ee
      HT_PLANNING_FLASK_QA_URL: http://127.0.0.1:8026
      TEST_RUNNER_HT_PLANNING_FLASK_QA_URL: http://127.0.0.1:8026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact integration tree
        env:
          PR_NUMBER: ${{ matrix.pr }}
          PR_HEAD: ${{ matrix.head }}
        run: |
          cp scripts/integration/ios_qa_app.py "$RUNNER_TEMP/ios_qa_app.py"
          git fetch origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD"
          git checkout --detach "$PR_HEAD"
          git -c user.name='Integration QA' -c user.email='qa@example.invalid' merge --no-commit --no-ff "$NUTRITION_HEAD"
          git diff --check
          git rev-parse HEAD
          git write-tree
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version | tee "$RUNNER_TEMP/versions.txt"
          swift --version | tee -a "$RUNNER_TEMP/versions.txt"
          # GitHub simulator login completed after the original 20s UI wait.
          # Only the injected QA wait changes; application and package sources stay exact.
          python - <<'PY'
          from pathlib import Path
          path = Path('ios/HealthTrackerUITests/LoginSmokeUITests.swift')
          text = path.read_text()
          old = 'waitForExistence(timeout: 20)'
          assert old in text
          text = text.replace(old, 'waitForExistence(timeout: 60)')
          focus = '        secure.tap()\n        secure.typeText(password)'
          assert focus in text
          text = text.replace(focus, '        secure.tap()\n        XCTAssertTrue(app.keyboards.firstMatch.waitForExistence(timeout: 10))\n        secure.tap()\n        secure.typeText(password)')
          path.write_text(text)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare backend and simulator
        run: |
          python -m pip install -r backend/requirements-dev.txt
          brew install xcodegen
          cd ios && xcodegen generate && cd ..
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'devices.json').read_text())
          device=next(d for runtime, devices in data['devices'].items() if 'iOS' in runtime for d in devices if 'iPhone' in d['name'])
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('SIMULATOR_ID='+device['udid']+'\n')
          PY
          HT_QA_CHECKOUT="$GITHUB_WORKSPACE" python "$RUNNER_TEMP/ios_qa_app.py" > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8026/api/v1/health > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Stabilize simulator input
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Swift Package tests on macOS including real Flask convergence
        working-directory: ios/HealthTrackerKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-package.log"
      - name: Swift Package tests on iOS Simulator
        if: ${{ !contains(github.event.head_commit.message, '[simulator-signing]') }}
        working-directory: ios/HealthTrackerKit
        run: xcodebuild -scheme HealthTrackerKit -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath "$RUNNER_TEMP/package.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: SwiftUI tests against disposable Flask backend
        working-directory: ios
        env:
          TEST_RUNNER_QA_SERVER_URL: http://127.0.0.1:8026
          TEST_RUNNER_QA_USERNAME: ios-ci-qa
          TEST_RUNNER_QA_PASSWORD: fictional-ios-ci-qa-password
          TEST_RUNNER_QA_EXPECTED_SESSION: Rutina CI QA
          TEST_RUNNER_QA_EXPECTED_WORKOUT: Fuerza CI QA
          TEST_RUNNER_QA_EXPECTED_EXERCISE: Sentadilla QA
          TEST_RUNNER_QA_EXPECTED_TODAY_WORKOUT: Fuerza CI QA
          TEST_RUNNER_QA_EXPECTED_CATALOG_EXERCISE: Sentadilla QA
        run: xcodebuild -project HealthTracker.xcodeproj -scheme HealthTracker -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/app.xcresult" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
      - name: Summarize UI results
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/app.xcresult"; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/app.xcresult"
          fi
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-pr-${{ matrix.pr }}-evidence
          path: |
            ${{ runner.temp }}/package.xcresult
            ${{ runner.temp }}/app.xcresult
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/swift-package.log
            ${{ runner.temp }}/versions.txt
          if-no-files-found: ignore
  planning-regression:
    if: ${{ contains(github.event.head_commit.message, '[planning-regression]') }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce edit while create request is in flight
        run: |
          cp scripts/integration/PlanningInFlightTests.swift "$RUNNER_TEMP/PlanningInFlightTests.swift"
          git fetch origin refs/pull/17/head
          test "$(git rev-parse FETCH_HEAD)" = cb664a9ace2160f2adbe46763cee7935dd688fd4
          git checkout --detach cb664a9ace2160f2adbe46763cee7935dd688fd4
          git -c user.name='Integration QA' -c user.email='qa@example.invalid' merge --no-commit --no-ff 518deebc769550c9f4259fa9db3f49107df113ee
          cp "$RUNNER_TEMP/PlanningInFlightTests.swift" ios/HealthTrackerKit/Tests/HealthTrackerKitTests/
          cd ios/HealthTrackerKit
          swift test --filter PlanningInFlightIntegrationTests
